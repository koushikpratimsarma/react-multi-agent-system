<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in · AI Agent</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex min-h-screen items-center justify-center bg-gray-950 px-4 text-gray-100">

    <div class="w-full max-w-sm">

        <div class="rounded-2xl border border-gray-800 bg-gray-900 p-8 shadow-2xl">

            <!-- Branding -->
            <div class="mb-8 flex flex-col items-center text-center">
                <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-gray-700 text-3xl">
                    🤖
                </div>

                <h1 id="pageTitle" class="mt-4 text-xl font-semibold">
                    Sign in
                </h1>

                <p class="mt-1 text-sm text-gray-500">
                    Multi-Agent System
                </p>
            </div>

            <!-- Error message -->
            <div
                id="formError"
                class="mb-4 hidden rounded-lg border border-red-900/60 bg-red-950/50 px-4 py-3 text-sm text-red-400"
            ></div>

            <!-- Auth form (used for both sign in and sign up) -->
            <form id="authForm" class="space-y-5" novalidate>

                <div>
                    <label for="username" class="mb-1.5 block text-sm font-medium text-gray-300">
                        Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        minlength="3"
                        maxlength="32"
                        required
                        autofocus
                        placeholder="Enter your username"
                        class="w-full rounded-lg border border-gray-700 bg-gray-950 px-3 py-2.5 text-gray-100 outline-none placeholder:text-gray-600 focus:border-gray-500"
                    />
                </div>

                <div>
                    <label for="password" class="mb-1.5 block text-sm font-medium text-gray-300">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        minlength="8"
                        required
                        placeholder="Enter your password"
                        class="w-full rounded-lg border border-gray-700 bg-gray-950 px-3 py-2.5 text-gray-100 outline-none placeholder:text-gray-600 focus:border-gray-500"
                    />
                </div>

                <button
                    id="submitButton"
                    type="submit"
                    class="w-full rounded-xl bg-white px-4 py-2.5 font-medium text-black transition hover:bg-gray-200"
                >
                    Sign in
                </button>

            </form>

            <p class="mt-6 text-center text-sm text-gray-500">
                <span id="toggleHint">Need an account?</span>
                <button
                    id="toggleMode"
                    type="button"
                    class="ml-1 font-medium text-gray-300 underline-offset-4 hover:text-white hover:underline"
                >
                    Create one
                </button>
            </p>

        </div>

    </div>

    <script>
        // Already signed in? Go straight to the chat.
        if (localStorage.getItem("token")) {
            window.location.replace("/");
        }

        const form = document.getElementById("authForm");
        const errorBox = document.getElementById("formError");
        const pageTitle = document.getElementById("pageTitle");
        const submitButton = document.getElementById("submitButton");
        const toggleMode = document.getElementById("toggleMode");
        const toggleHint = document.getElementById("toggleHint");

        // Mode: "signin" or "register"
        let mode = "signin";

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.remove("hidden");
        }

        function switchMode(next) {
            mode = next;
            errorBox.classList.add("hidden");

            if (mode === "signin") {
                pageTitle.textContent = "Sign in";
                submitButton.textContent = "Sign in";
                toggleHint.textContent = "Need an account?";
                toggleMode.textContent = "Create one";
                document.getElementById("password").setAttribute("autocomplete", "current-password");
            } else {
                pageTitle.textContent = "Create account";
                submitButton.textContent = "Create account";
                toggleHint.textContent = "Already have an account?";
                toggleMode.textContent = "Sign in";
                document.getElementById("password").setAttribute("autocomplete", "new-password");
            }
        }

        toggleMode.addEventListener("click", () => {
            switchMode(mode === "signin" ? "register" : "signin");
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            errorBox.classList.add("hidden");

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            if (!username || !password) {
                showError("Please enter your username and password.");
                return;
            }

            const endpoint = mode === "signin" ? "/api/auth/login" : "/api/auth/register";

            const response = await fetch(endpoint, {
                method: "POST",
                headers: {
                    "Content-Type": mode === "signin"
                        ? "application/x-www-form-urlencoded"
                        : "application/json",
                },
                body: mode === "signin"
                    ? new URLSearchParams({ username, password })
                    : JSON.stringify({ username, password }),
            });

            if (!response.ok) {
                if (response.status === 401) {
                    showError("Invalid username or password.");
                } else if (response.status === 409) {
                    showError("That username is already taken.");
                } else {
                    const data = await response.json().catch(() => null);
                    const detail = data?.detail;

                    if (typeof detail === "string") {
                        showError(detail);
                    } else if (Array.isArray(detail) && detail.length > 0) {
                        showError(detail[0].msg || "Please check your input.");
                    } else {
                        showError("Something went wrong. Please try again.");
                    }
                }
                return;
            }

            const data = await response.json();

            localStorage.setItem("token", data.access_token);

            window.location.replace("/");
        });
    </script>
</body>

</html>
