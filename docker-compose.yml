services:

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432" # host 5433 -> container 5432 (5432 on host is used by a local PostgreSQL)

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - agents-network

  app:
    build: .

    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EXA_API_KEY: ${EXA_API_KEY}

      POSTGRES_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    # The app is only reachable through the nginx reverse proxy now.
    # It is NOT published on the host - only other containers can use it.
    expose:
      - "8000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - agents-network

    restart: unless-stopped

  nginx:
    image: nginx:alpine

    # Single public entry point. Configurable with NGINX_PORT in .env.
    ports:
      - "${NGINX_PORT:-8080}:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - agents-network

    restart: unless-stopped

volumes:
  postgres_data:

networks:
  agents-network:
    driver: bridge