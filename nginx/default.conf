# Nginx reverse proxy for the FastAPI Multi-Agent System.
#
# This config is mounted into the `nginx` service as
# /etc/nginx/conf.d/default.conf, replacing the stock nginx server block.

upstream app_backend {
    # `app` is the Docker Compose service name of the FastAPI container.
    server app:8000;

    # Keep a pool of long-lived connections to the backend.
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;

        # Pass through the original request details.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strip the Connection header so keep-alive to the backend works over HTTP/1.1.
        proxy_set_header Connection "";

        # Server-Sent Events (/chat/stream) must never be buffered.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Generous timeouts: agent runs and SSE streams can stay open for minutes.
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Tell any downstream proxy/client not to buffer the stream either.
        add_header X-Accel-Buffering no;
    }

    # Static assets and the Swagger docs are also served through the proxy,
    # so long-running answers stay snappy while normal pages cache fine.
}